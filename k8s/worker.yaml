apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: image-system

spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: distributed-task-processor-worker:v2
          imagePullPolicy: Never

          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/image-processing"

            - name: REDIS_HOST
              value: "redis"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"

          volumeMounts:
            - name: image-storage
              mountPath: /app/uploads
              subPath: uploads

            - name: image-storage
              mountPath: /app/processed
              subPath: processed

      volumes:
        - name: image-storage
          persistentVolumeClaim:
            claimName: image-storage-pvc