services:

  mongo:
    image: mongo:6-jammy
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: always
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/jobs
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://rabbitmq
      ADMIN_SECRET: ${ADMIN_SECRET}
    volumes:
      - uploads_data:/app/uploads
      - processed_data:/app/processed

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: always
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/jobs
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://rabbitmq
    volumes:
      - uploads_data:/app/uploads
      - processed_data:/app/processed

  frontend:
    build:
      context: ./dashboard
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  mongo_data:
  uploads_data:
  processed_data: